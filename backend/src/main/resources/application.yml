spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: file:./uploads/,classpath:/static/
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/racketmatch}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-at-least-256-bit-random-string-in-production-env}
    access-expiry: 86400     # 24 godziny
    refresh-expiry: 2592000  # 30 dni

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
